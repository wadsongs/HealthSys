name: CI HealthSys

# Define quando o pipeline vai rodar (ao fazer push ou pull request na branch main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build e Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Tornar o wrapper do Gradle executável
        working-directory: ./Backend/pacientes
        run: chmod +x gradlew

      - name: Build e Testes - Pacientes (Gradle)
        working-directory: ./Backend/pacientes
        run: ./gradlew build

      - name: Build e Testes - Prontuário (Maven)
        working-directory: ./Backend/prontuario
        run: mvn clean install

      - name: Build e Testes - Usuários (Maven)
        working-directory: ./Backend/usuarios
        run: mvn clean install

      - name: Build e Testes - Triagem (Maven)
        working-directory: ./Backend/triagem
        run: mvn clean install

      - name: Build e Testes - API Gateway (Maven)
        working-directory: ./Backend/api-gateway
        run: mvn clean install


      - name: Validar build das imagens Docker
        working-directory: ./Backend
        run: docker compose build