name: CI HealthSys

# Executa em push e pull request na branch main.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: ./Backend

jobs:
  # ---------------------------------------------------------------------------
  # Build + testes unitários de TODOS os microsserviços (Maven + Gradle).
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build e Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # --- SERVIÇO GRADLE ---
      - name: Build e Testes — Pacientes (Gradle)
        working-directory: ./Backend/pacientes
        run: gradle build --no-daemon

      # --- SERVIÇOS MAVEN ---
      - name: Build e Testes — API Gateway (Maven)
        working-directory: ./Backend/api-gateway
        run: mvn -B clean verify

      - name: Build e Testes — Usuários (Maven)
        working-directory: ./Backend/usuarios
        run: mvn -B clean verify

      - name: Build e Testes — Prontuário (Maven)
        working-directory: ./Backend/prontuario
        run: mvn -B clean verify

      - name: Build e Testes — Triagem (Maven)
        working-directory: ./Backend/triagem
        run: mvn -B clean verify

  # ---------------------------------------------------------------------------
  # Validação de infraestrutura: as imagens Docker de todos os serviços buildam.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Validar build das imagens Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: docker compose build
        run: docker compose build
