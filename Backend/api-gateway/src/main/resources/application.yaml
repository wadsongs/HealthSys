spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Serviço de Usuários — rotas públicas (sem JWT)
        - id: usuarios-auth
          uri: ${USERS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        # WebSocket / STOMP (usuários) — JWT via Authorization ou ?access_token= (SockJS)
        - id: usuarios-websocket
          uri: ${USERS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=0
            - name: JwtAuthGatewayFilter

        # Serviço de Usuários — rotas protegidas
        - id: usuarios-service
          uri: ${USERS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/usuarios/**
          filters:
            - StripPrefix=0
            - name: JwtAuthGatewayFilter

        # Serviço de Prontuário — rotas protegidas
        - id: prontuario-service
          uri: ${RECORDS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/prontuarios/**
          filters:
            - StripPrefix=0
            - name: JwtAuthGatewayFilter

        # Serviço de Pacientes
        - id: paciente-service
          uri: ${PATIENTS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/pacientes/**
          filters:
            - StripPrefix=0
            - name: JwtAuthGatewayFilter

        # Serviço de Triagem
        - id: triagem-service
          uri: ${TRIAGE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/triagens/**
          filters:
            - StripPrefix=0
            - name: JwtAuthGatewayFilter

server:
  port: 8080

jwt:
  secret: healthsys-secret-key-unifor-2024-distributed-systems

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}